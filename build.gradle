plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
	// Client-only mod: everything lives in one source set, and only the client run is useful.
	runs {
		client {
			runDir "run/client"
			programArgs "--username", "Player1"
		}
	}
}

fabricApi {
	// In-game check: ./gradlew runClientGameTest opens a flat world, spawns cows and screenshots the
	// bars and the panel into build/run/clientGameTest/screenshots. Source in src/gametest.
	configureTests {
		createSourceSet = true
		modId = "indicatorbars-test"
		enableGameTests = false
		eula = true
	}
}

// Everyday runs test what's new; -Pfull adds every 1.0.0 scene, for a release.
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	systemProperty "indicatorbars.fullTest", providers.gradleProperty("full").isPresent()
	systemProperty "indicatorbars.testOnly", providers.gradleProperty("only").getOrElse("")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
