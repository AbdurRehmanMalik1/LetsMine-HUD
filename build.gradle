plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

neoForge {
    version = project.neo_version

    // Client-only mod: no server run.
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            programArguments.addAll '--username', 'Player1'
            // ./gradlew runClient -PquickPlay="New World" opens that world straight away.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            mod_id                   : mod_id,
            version                  : version,
            mod_name                 : mod_name,
            mod_description          : mod_description,
            mod_license              : mod_license,
            author_name              : author_name,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            neoforge_minecraft_side  : neoforge_minecraft_side,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
