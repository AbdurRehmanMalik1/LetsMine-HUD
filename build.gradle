plugins {
    id 'net.minecraftforge.gradle' version '6.0.16'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    // Client-only mod: no server run.
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'info'
            args '--username', 'Player1'
            // ./gradlew runClient -PquickPlay="World" opens that world straight away (platform/DevQuickPlay:
            // this version has no --quickPlaySingleplayer).
            if (project.hasProperty('quickPlay')) {
                property 'indicatorbars.quickPlay', project.property('quickPlay')
            }
            // -PtestScene: play testing/ib_test, screenshot it and quit (platform/DevQuickPlay).
            if (project.hasProperty('testScene')) {
                property 'indicatorbars.testScene', 'true'
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

repositories {
    // ForgeGradle 6.0.16's artifact downloader fails to resolve the Forge userdev artifact when an
    // exclusiveContent{} repository is declared (see Weaponry's forge/1.20.1).
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            mod_id                 : mod_id,
            version                : version,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_license            : mod_license,
            author_name            : author_name,
            minecraft_min_version  : minecraft_min_version,
            minecraft_max_version  : minecraft_max_version,
            forge_min_version      : forge_min_version,
            forge_displaytest_value: forge_displaytest_value,
            forge_minecraft_side   : forge_minecraft_side
    ]

    inputs.properties properties

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Classes and resources stay in Gradle's separate output folders: Forge 1.16 takes the first dev mod path
// as resources and scans only the others for classes, so one shared folder would hide every class.
